name: uluslararasi_alevi_vakfi
description: "Uluslararası Alevi Vakfı mobil uygulaması"
publish_to: 'none'

version: 1.0.0+21

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.1
  flutter_widget_from_html_core: ^0.10.3
  intl: ^0.19.0
  http: ^1.2.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  remove_alpha_ios: true
