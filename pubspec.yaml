name: uluslararasi_alevi_vakfi
description: "Uluslararası Alevi Vakfı mobil uygulaması"
publish_to: 'none'

version: 1.0.0+26

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.5.0
  hive_flutter: ^1.1.0
  url_launcher: ^6.2.5
  http: ^1.2.0
  flutter_widget_from_html_core: any
  share_plus: ^8.0.0
  table_calendar: ^3.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  flutter_local_notifications: ^17.0.0
  onesignal_flutter: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo.png"
  remove_alpha_ios: true
